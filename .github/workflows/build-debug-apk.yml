# Fork-only workflow: upstream builds on Buildkite (Automattic's private
# agents), which the fork cannot use, so build the debug APK here.
# Produces app/build/outputs/apk/debugProd/app-debugProd.apk with the
# fork applicationId (au.com.shiftyjelly.pocketcasts.fork.debug).
name: Build debug APK (fork)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub sets CI=true by default, but settings.gradle.kts uses CI=true
      # to point Gradle at Automattic's internal remote build cache
      # (10.0.2.214), unreachable from here. Force it off so the build
      # runs without a remote cache.
      CI: "false"
      # ubuntu runners preinstall the Android SDK here; setup-android's
      # license step hangs on an interactive prompt, so use the
      # preinstalled SDK directly instead.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Android SDK components
        uses: actions/cache@v4
        with:
          # Only the versioned components this workflow installs; the
          # runner preinstalls the rest. Keyed on this workflow file, which
          # holds the package list, so a package change invalidates it.
          path: |
            /usr/local/lib/android/sdk/platforms/android-36
            /usr/local/lib/android/sdk/build-tools/36.0.0
          key: android-sdk-${{ runner.os }}-${{ hashFiles('.github/workflows/build-debug-apk.yml') }}

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        # Caches the Gradle distribution, dependency cache
        # (caches/modules-2, transforms, jars), compiled build scripts,
        # and the local build cache (caches/build-cache-1, which the
        # project enables via org.gradle.caching=true). Keys are derived
        # from the build files, so dependency changes invalidate them.
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :app:assembleDebugProd -PskipSentryProguardMappingUpload=true --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-casts-fork-debug-apk
          path: app/build/outputs/apk/debugProd/*.apk
          if-no-files-found: error
